# ===================================================================
# Samples for required secrets to be used in development and ci using prod profile.
# ===================================================================

spring:
  datasource:
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:change-me}

jhipster:
  security:
    authentication:
      jwt:
        # Dummy development/sample fallback only. Do not use in production.
        # Decodes to 66 bytes, enough for HS512. Override with JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET.
        base64-secret: ${JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET:ZGV2ZWxvcG1lbnQtb25seS1oczUxMi1qd3Qtc2VjcmV0LWR1bW15LWNoYW5nZS1tZS02NC1ieXRlcy1taW5pbXVt}
