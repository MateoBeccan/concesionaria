services:
  - type: web
    name: concesionaria-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /management/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET
        sync: false
      - key: JHIPSTER_MAIL_BASE_URL
        sync: false
      - key: APP_SECURITY_REGISTRATION_PUBLIC_ENABLED
        value: "false"
